.o-bond .den b{display:grid;place-items:center;width:2.5em;height:2.5em;border-radius:50%;border:2px solid #1e4a3a;box-shadow:inset 0 0 0 3px var(--sec),inset 0 0 0 4px #1e4a3a;font-size:1.25em;font-weight:900;font-variation-settings:"wdth" 70;color:#123528}
.o-bond .den span{font-size:.64em;line-height:1.2;max-width:8.5em;font-weight:600}
.o-bond .coupons{border-left:1px dashed #1e4a3a;display:grid;grid-template-rows:repeat(6,1fr);position:relative;margin:.9em .9em .9em 0}
.o-bond .coupons i{font-style:normal;border-bottom:1px dashed #1e4a3a;display:grid;place-items:center;font-family:var(--f-serif);font-size:.72em;color:#1e4a3a}
.o-bond .coupons i:last-child{border-bottom:0}

/* scorecard */
.o-score{width:27.5em;background:var(--paper);box-shadow:var(--lift);border-radius:.25em;overflow:hidden}
.o-score .band{background:#1F5A3F;color:var(--paper);padding:.8em 1.1em;display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.o-score .band b{font-size:1.02em;font-weight:800}
.o-score .band span{font-size:.74em;font-weight:600;white-space:nowrap}
.o-score .grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}
.o-score .cell{border-right:1px solid var(--ink);padding:.7em .5em .8em;text-align:center}
.o-score .cell:last-child{border-right:0}
.o-score .cell b{display:block;font-family:var(--f-serif);font-style:italic;font-size:2em;line-height:1.1;color:#2b3f8f;transform:rotate(-3deg)}
.o-score .cell span{font-size:.64em;line-height:1.2;display:block;margin-top:.35em;font-weight:600}
.o-score .sfoot{display:flex;justify-content:space-between;gap:1em;padding:.6em 1.1em;font-size:.72em;font-weight:600}
.o-score .sfoot em{font-family:var(--f-serif);color:#2b3f8f}

/* caddie bag tag */
.o-tag{width:13em;padding-top:3.4em}
.o-tag::before{content:"";position:absolute;left:50%;top:0;width:2.6em;height:5.4em;margin-left:-1.3em;border:.62em solid #6f4628;border-radius:1.4em;box-shadow:0 .2em .4em rgba(0,0,0,.4)}
.o-tag .tag{position:relative;background:var(--leather);border-radius:1.2em 1.2em 6.5em 6.5em;padding:1.6em 1em 2.2em;box-shadow:var(--lift);outline:1px dashed rgba(243,238,223,.55);outline-offset:-.45em}
.o-tag .tag::before{content:"";display:block;width:1.5em;height:1.5em;border-radius:50%;background:var(--baize-deep);margin:0 auto .9em;box-shadow:0 0 0 .25em #c9a16a}
.o-tag .ins{background:var(--paper);border-radius:.5em .5em 4.5em 4.5em;padding:.9em .7em 2em;text-align:center}
.o-tag .ins small{display:block;font-size:.64em;font-weight:700;line-height:1.25}
.o-tag .ins b{display:block;font-size:2.6em;font-weight:900;font-variation-settings:"wdth" 64;line-height:1;margin:.25em 0 .05em}
.o-tag .ins span{font-size:.7em;font-weight:600}
.o-tag .ins em{display:block;font-family:var(--f-serif);font-size:.72em;margin-top:.4em}

/* receipt */
.o-receipt{width:15.5em;filter:drop-shadow(0 14px 12px rgba(0,0,0,.45))}
.o-receipt .rc{background:#FBFAF4;padding:1.3em 1.1em 2em;font-family:var(--f-type);font-size:.78em;line-height:1.45;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/.9em 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/.9em 100%}
.o-receipt .c{text-align:center}
.o-receipt .c b{font-size:1.1em}
.o-receipt hr{border:0;border-top:1px dashed var(--ink);margin:.7em 0}
.o-receipt .ln{display:flex;justify-content:space-between;gap:.6em}
.o-receipt .ln span:last-child{font-weight:700}
.o-receipt .tot{font-weight:700;font-size:1.05em}

/* white paper */
.o-paper{width:18em;height:23.4em;background:var(--buff);box-shadow:var(--lift);padding:1.4em;display:flex;flex-direction:column;border-left:.9em solid var(--canary)}
.o-paper .org{font-size:.72em;font-weight:700;line-height:1.3}
.o-paper .li{width:6.2em;height:6.6em;border:.18em solid var(--ink);padding:.3em .45em;margin:1.3em 0 1em;display:flex;flex-direction:column;background:var(--paper)}
.o-paper .li i{font-style:normal;font-size:.8em;font-weight:700}
.o-paper .li b{font-size:3.1em;line-height:.95;font-weight:800;font-variation-settings:"wdth" 80}
.o-paper .li span{font-size:.62em;font-weight:600;display:flex;justify-content:space-between}
.o-paper .ttl{font-family:var(--f-serif);font-size:2.05em;line-height:1.05}
.o-paper .role{font-size:.78em;font-weight:600;margin-top:auto;border-top:1px solid var(--ink);padding-top:.6em;display:flex;justify-content:space-between;gap:1em}

/* pitch slide */
.o-slide{width:27.5em;height:15.5em;background:var(--ink);color:var(--paper);box-shadow:var(--lift),0 0 0 .5em #dfe3e6,0 0 0 .56em #9aa1a8;padding:1.5em 1.7em;display:flex;flex-direction:column}
.o-slide .org{font-size:.72em;font-weight:600;color:rgba(243,238,223,.75)}
.o-slide .ttl{font-size:2.6em;line-height:.9;font-weight:900;font-variation-settings:"wdth" 66;text-transform:uppercase;margin-top:.35em;max-width:7.5em}
.o-slide .th{display:flex;flex-wrap:wrap;gap:.5em;margin-top:auto}
.o-slide .th span{font-size:.7em;font-weight:600;border:1px solid rgba(243,238,223,.6);padding:.3em .7em;border-radius:99em}
.o-slide .pg{position:absolute;right:1.6em;bottom:1.4em;font-size:.7em;font-weight:600;color:rgba(243,238,223,.7)}
.o-slide .buy{position:absolute;right:1.3em;top:1.1em;font-size:2em;font-weight:900;font-variation-settings:"wdth" 70;color:var(--canary);border:.12em solid var(--canary);padding:.02em .3em;border-radius:.12em;transform:rotate(9deg);letter-spacing:.04em}
.h-golf{width:6.4em;height:6.4em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e7e3d6 60%,#b9b4a4);box-shadow:var(--lift);position:relative;overflow:hidden}
.h-golf::before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle,rgba(0,0,0,.2) 0 .17em,transparent .2em) 0 0/.78em .78em,radial-gradient(circle,rgba(0,0,0,.2) 0 .17em,transparent .2em) .39em .39em/.78em .78em;border-radius:50%}
.h-pickle{width:6.4em;height:6.4em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe268,var(--canary) 60%,#b78f12);box-shadow:var(--lift);position:relative;overflow:hidden}
.h-pickle::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(40,30,0,.75) 0 .36em,transparent .4em) .25em .25em/1.9em 1.9em,radial-gradient(circle,rgba(40,30,0,.75) 0 .36em,transparent .4em) 1.2em 1.2em/1.9em 1.9em}
.h-packet{width:8.2em;height:4.6em;background:linear-gradient(160deg,#d8432f,var(--stamp) 55%,#8e2219);border-radius:.3em;box-shadow:var(--lift);display:grid;place-items:center;color:var(--paper);font-weight:900;font-variation-settings:"wdth" 70;font-size:1em;text-transform:uppercase;letter-spacing:.04em;position:relative;transform:rotate(-6deg)}
.h-packet::before,.h-packet::after{content:"";position:absolute;top:0;bottom:0;width:.7em;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px .2em)}
.h-packet::before{left:0}.h-packet::after{right:0}
.h-packet span{font-size:.95em}
.h-hold{width:7em;height:5.6em;background:radial-gradient(circle at 30% 25%,#f8d2ce,var(--pink) 50%,#c9807a);border-radius:62% 38% 55% 45%/55% 60% 40% 45%;box-shadow:var(--lift);position:relative}
.h-hold::before{content:"";position:absolute;left:44%;top:40%;width:1.3em;height:1.3em;border-radius:50%;background:#3a3f45;box-shadow:inset 0 .15em .3em #000,0 0 0 .2em rgba(0,0,0,.18)}
.h-stub{width:8.4em;height:4.4em;background:var(--paper);color:var(--ink);box-shadow:var(--lift);display:grid;grid-template-columns:1fr 2em;transform:rotate(5deg);-webkit-mask:radial-gradient(circle at 0 50%,#0000 .55em,#000 .58em) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 .55em,#000 .58em) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,#0000 .55em,#000 .58em) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 .55em,#000 .58em) right/51% 100% no-repeat}
.h-stub b{display:grid;place-items:center;font-size:1.05em;font-weight:900;font-variation-settings:"wdth" 66;text-transform:uppercase;line-height:.95;padding-left:.8em;text-align:center}
.h-stub i{border-left:1px dashed var(--ink);background:repeating-linear-gradient(var(--ink) 0 .12em,transparent .12em .3em,var(--ink) .3em .36em,transparent .36em .6em);margin:.5em .7em .5em 0;border-left-width:0}
.h-recipe{width:8em;height:5.4em;background:#fbfaf4 repeating-linear-gradient(transparent 0 .82em,#9fb6d8 .82em .88em);box-shadow:var(--lift);border-top:1.25em solid #fbfaf4;position:relative;transform:rotate(-3deg);color:var(--ink)}
.h-recipe::before{content:"";position:absolute;left:0;right:0;top:0;border-top:.1em solid var(--stamp)}
.h-recipe span{position:absolute;left:.6em;top:-1.15em;font-family:var(--f-serif);font-style:italic;font-size:.82em}
.h-road{width:8em;height:5em;background:#1F6B4A;border-radius:.5em;box-shadow:var(--lift),inset 0 0 0 .22em var(--paper),inset 0 0 0 .3em #1F6B4A;display:grid;place-items:center;color:var(--paper);font-weight:800;font-size:1em;line-height:1.05;text-align:center}
.h-road span{font-size:1em}
.h-road svg{width:2.2em;height:1em;display:block;margin:.2em auto 0}
.h-patch{width:6.6em;height:6.6em;border-radius:50%;background:#254a73;box-shadow:var(--lift),inset 0 0 0 .3em var(--canary),inset 0 0 0 .42em #254a73;outline:1px dashed rgba(243,238,223,.7);outline-offset:-.75em;display:grid;place-items:center}
.h-patch svg{width:3.6em;height:3.6em}
.ticket{background:var(--tk,var(--pink));color:var(--ink);font-family:var(--f-type);font-size:14.5px;line-height:1.45;padding:18px 18px 20px;box-shadow:var(--lift);position:relative;transform:rotate(1.2deg)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;background:radial-gradient(circle at 5px 8px,var(--tk,var(--pink)) 4.5px,transparent 5px) 0 0/10px 8px}
.ticket .side{float:right;margin:-2px -4px 6px 10px;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 70;font-size:15px;border:2px solid var(--stamp);color:var(--stamp);padding:0 7px;transform:rotate(6deg);border-radius:3px}
.ticket h3{font-family:var(--f-display);font-size:1.7rem;line-height:.95;font-weight:900;font-variation-settings:"wdth" 68;text-transform:uppercase;margin-bottom:10px}
.ticket .row{clear:both}
.ticket .row{display:grid;grid-template-columns:5.2em 1fr;gap:8px;border-top:1px dashed rgba(21,32,43,.5);padding:5px 0}
.ticket .row span:first-child{font-weight:700}
.ticket ul{border-top:1px dashed rgba(21,32,43,.5);padding-top:8px;margin-top:2px}
.ticket li{padding-left:1.2em;position:relative;margin-bottom:6px}
.ticket li::before{content:"-";position:absolute;left:0}
.plain{padding:clamp(40px,7vw,80px) 0 0}
.plain h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;font-variation-settings:"wdth" 80;margin-bottom:24px}
.plain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:34px 26px;align-items:start}
.plain-grid .ticket:nth-child(3n+1){--tk:var(--pink);transform:rotate(-.8deg)}
.plain-grid .ticket:nth-child(3n+2){--tk:#F6E7A0;transform:rotate(.7deg)}
.plain-grid .ticket:nth-child(3n){--tk:var(--paper);transform:rotate(-.3deg)}
/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.mapframe{position:relative;background:#BFD6D2;border-radius:6px;box-shadow:var(--lift),0 0 0 10px var(--paper);margin:10px;overflow:hidden;aspect-ratio:5/3.4}
.mapframe::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(0,0,0,.08) 33.3%,rgba(255,255,255,.18) 33.5%,transparent 33.7%,transparent 66.5%,rgba(0,0,0,.08) 66.6%,rgba(255,255,255,.18) 66.8%,transparent 67%),linear-gradient(transparent 49.8%,rgba(0,0,0,.07) 50%,rgba(255,255,255,.16) 50.2%,transparent 50.4%)}
.mapframe svg{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.mapframe svg.drag{cursor:grabbing}
.m-land{fill:var(--buff);stroke:#8b8468;stroke-width:.7;vector-effect:non-scaling-stroke}
.m-bord{fill:none;stroke:#a59c7c;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-us{fill:#EFE5C6;stroke:#8b8468;stroke-width:.7;vector-effect:non-scaling-stroke}
.m-st{fill:none;stroke:#b3a983;stroke-width:.6;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .head{stroke:var(--ink);stroke-width:1.6;transition:r .2s}
.pin .needle{stroke:var(--ink);stroke-width:1.6}
.pin .shadow{fill:rgba(0,0,0,.28)}
.pin text{font-family:var(--f-display);font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--buff);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.pin.g-home .head{fill:var(--canary)}
.pin.g-work .head{fill:#2F7D5B}
.pin.g-visited .head{fill:var(--pink)}
.pin.g-wishlist .head{fill:var(--paper);stroke-dasharray:3 2}
.pin.sel .head{r:10}
.pin.off{display:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;min-width:38px;height:38px;padding:0 10px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.25)}
.mapctl button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.maphelp{position:absolute;left:12px;bottom:10px;font-size:12.5px;font-weight:600;color:var(--ink);background:rgba(243,238,223,.85);padding:3px 9px;border-radius:99px;z-index:2}
.mapside{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px;box-shadow:var(--lift);margin-top:10px;transform:rotate(.6deg)}
.mapside h2{font-size:1.5rem;font-weight:900;font-variation-settings:"wdth" 72;text-transform:uppercase;line-height:1;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend button{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1.5px solid var(--ink)}
.legend button i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.legend button[aria-pressed="false"]{opacity:.45}
.legend button:disabled{opacity:.5;border-style:dashed;cursor:default}
.legend .g-home i{background:var(--canary)}.legend .g-work i{background:#2F7D5B}.legend .g-visited i{background:var(--pink)}.legend .g-wishlist i{background:var(--paper);border-style:dashed}
.placelist li{border-top:1px solid rgba(21,32,43,.2)}
.placelist button{display:grid;grid-template-columns:14px 1fr;gap:4px 10px;align-items:baseline;width:100%;text-align:left;padding:10px 4px;border-radius:4px}
.placelist button i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);align-self:center}
.placelist button b{font-size:15.5px}
.placelist button span{grid-column:2;font-size:13.5px;color:#3b4650;line-height:1.35}
.placelist button[aria-current="true"]{background:rgba(244,201,47,.35)}
.placelist .g-home i{background:var(--canary)}.placelist .g-work i{background:#2F7D5B}.placelist .g-visited i{background:var(--pink)}.placelist .g-wishlist i{background:var(--paper);border-style:dashed}
.maphint{margin-top:14px;font-size:13.5px;border:1px dashed rgba(21,32,43,.5);border-radius:8px;padding:10px 12px;color:#3b4650}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}.mapframe{aspect-ratio:4/4.2}.mapside{transform:none}}
@media (max-width:900px){.mapctl{top:auto;bottom:10px;flex-direction:row}.maphelp{bottom:auto;top:10px}}
.creds{display:grid;gap:26px}
.plaque{background:var(--sec);color:var(--ink);padding:26px 24px;box-shadow:var(--lift);position:relative;text-align:center;transform:rotate(-1deg)}
.plaque svg.gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plaque small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1e4a3a;position:relative}
.plaque b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:clamp(1.5rem,3vw,2rem);line-height:1.15;margin:8px 0 2px;position:relative;color:#123528}
.plaque .seal{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--canary);color:var(--ink);font-weight:900;font-variation-settings:"wdth" 70;font-size:20px;margin-top:10px;box-shadow:0 0 0 3px var(--sec),0 0 0 5px var(--canary);position:relative}
.ribbons{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px 12px;margin-top:8px}
.rib{text-align:center;position:relative;padding-bottom:6px}
.rib .ros{width:84px;height:84px;margin:0 auto;border-radius:50%;background:repeating-conic-gradient(var(--rc,var(--canary)) 0 9deg,var(--rd,#c59f17) 9deg 18deg);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 6px 10px rgba(0,0,0,.35)}
.rib .ros::before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--paper)}
.rib .ros b{position:relative;color:var(--ink);font-size:12.5px;line-height:1.05;font-weight:900;font-variation-settings:"wdth" 72;text-transform:uppercase;max-width:54px}
.rib .tails{width:54px;height:46px;margin:-14px auto 8px;background:linear-gradient(var(--rc,var(--canary)),var(--rc,var(--canary))) left/46% 100% no-repeat,linear-gradient(var(--rd,#c59f17),var(--rd,#c59f17)) right/46% 100% no-repeat;clip-path:polygon(0 0,100% 0,100% 100%,77% 78%,54% 100%,54% 0,46% 0,46% 100%,23% 78%,0 100%)}
.rib p{font-size:14.5px;font-weight:700;line-height:1.25}
.rib p span{display:block;font-weight:500;font-size:13px;color:rgba(243,238,223,.72);margin-top:2px}
.rib:nth-child(4n+2){--rc:#5FB088;--rd:#2c6a4c}.rib:nth-child(4n+3){--rc:var(--pink);--rd:#b3746e}.rib:nth-child(4n){--rc:#d8432f;--rd:#8e2219}
.edu{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
@media (max-width:760px){.edu{grid-template-columns:1fr}}
.pennant{width:min(380px,86vw);aspect-ratio:2.5/1;background:#B5121B;clip-path:polygon(0 0,100% 50%,0 100%);display:flex;align-items:center;padding-left:9%;color:var(--paper);font-weight:900;font-variation-settings:"wdth" 64;font-size:clamp(34px,8vw,54px);text-transform:uppercase;border-left:14px solid var(--paper);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));transform:rotate(-4deg)}
.index{background:#fbfaf4 repeating-linear-gradient(transparent 0 31px,#9fb6d8 31px 32px);color:var(--ink);padding:14px 22px 20px;box-shadow:var(--lift);position:relative;line-height:32px;transform:rotate(.8deg);background-position:0 46px;max-width:620px}
.index::before{content:"";position:absolute;left:0;right:0;top:44px;border-top:2px solid var(--stamp)}
.index h3{font-family:var(--f-serif);font-size:1.25rem;line-height:32px;font-weight:700}
.index p,.index li{font-size:15.5px}
.index li::before{content:"·  "}

/* ---------- compact layout ---------- */
.sec{padding:clamp(44px,6vw,76px) 0 0}
.sec-head{margin-bottom:clamp(18px,2.5vw,28px)}
.sec-head h2{font-size:clamp(2.1rem,4.6vw,3.4rem)}
.page-head{padding:clamp(24px,3.5vw,44px) 0 clamp(18px,2.5vw,28px)}
.page-head h1{font-size:clamp(2.6rem,7vw,5rem)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- intro (first screen) ---------- */
.intro{min-height:calc(100svh - var(--nav-h));display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center;padding:clamp(18px,3vh,40px) 0}
.intro .badge-slot{width:100%;padding-top:40px}
.intro .badge-code{font-size:48px}
.kicker{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--canary)}
.intro h1{font-size:clamp(2.8rem,7vw,5.6rem);line-height:.86;font-weight:900;font-variation-settings:"wdth" 64;text-transform:uppercase;margin:8px 0 10px}
.tagline{font-family:var(--f-serif);font-size:clamp(1.15rem,1.9vw,1.5rem);line-height:1.3;color:rgba(243,238,223,.92)}
.contact-row{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;font-size:15.5px}
.contact-row li{display:flex;align-items:center;gap:8px}
.contact-row svg{width:18px;height:18px;flex:none;opacity:.85}
.contact-row a{font-weight:600;text-decoration:none;border-bottom:1px solid rgba(243,238,223,.35)}
.contact-row a:hover{border-color:var(--canary);color:var(--canary)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--canary);color:var(--ink);font-weight:700;font-size:15px;padding:10px 16px;border-radius:8px;text-decoration:none;transition:filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn.alt{background:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid rgba(243,238,223,.45)}
.about-copy{margin-top:24px;border-top:1px solid rgba(243,238,223,.22);padding-top:20px}
.about-copy p{font-size:clamp(1rem,1.3vw,1.08rem);max-width:64ch;margin-bottom:.8em;color:rgba(243,238,223,.9)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin-top:14px;font-size:.95rem;max-width:64ch}
.facts div{display:grid;gap:1px}
.facts dt{color:rgba(243,238,223,.6);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.facts dd{font-weight:600}
@media (max-width:820px){
  .intro{grid-template-columns:1fr;min-height:0;gap:18px;padding-top:12px}
  .intro .badge-slot{width:min(200px,56vw);justify-self:center;padding-top:34px}
  .intro .badge-slot::before{height:46px}
  .intro .badge{padding:12px 12px 14px}
  .intro .badge-code{font-size:34px}
  .intro-copy{text-align:center}
  .contact-row,.actions{justify-content:center}
  .about-copy{text-align:left}
}
@media (max-width:520px){.facts{grid-template-columns:1fr}}

/* ---------- experience & campus entries ---------- */
.xp{display:grid;gap:16px}
.xp-item{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:center;background:rgba(9,42,32,.5);border:1px solid rgba(243,238,223,.14);border-radius:14px;padding:clamp(16px,2.2vw,24px)}
.xp-art{--em:8px;display:grid;place-items:center;transform:rotate(var(--r,0deg))}
.obj{display:block;position:relative;text-align:left;font-size:var(--em);color:var(--ink)}
.xp-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.xp-top h3{font-size:clamp(1.25rem,2vw,1.55rem);line-height:1.1;font-weight:800;font-variation-settings:"wdth" 80}
.xp-dates{font-size:14px;font-weight:600;color:var(--canary);white-space:nowrap}
.xp-org{margin:4px 0 10px;color:rgba(243,238,223,.78);font-size:15px;font-weight:500}
.xp-bul li{position:relative;padding-left:20px;margin-bottom:6px;font-size:15px;line-height:1.45;color:rgba(243,238,223,.92)}
.xp-bul li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:2px;background:var(--canary)}
.campus-also{margin-top:16px;color:rgba(243,238,223,.8);font-size:15px}
@media (max-width:760px){.xp-item{grid-template-columns:1fr}.xp-art{--em:7px}}
@media (max-width:600px){.xp-art{display:none}.xp-item{padding:16px}}

/* ---------- hobbies (photos shown on the page) ---------- */
.hob-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}
.hob-card{background:rgba(9,42,32,.5);border:1px solid rgba(243,238,223,.14);border-radius:14px;padding:16px}
.hob-card header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hob-card h3{font-size:1.2rem;font-weight:800;font-variation-settings:"wdth" 80;line-height:1.1}
.hob-card header span.nt{display:block;font-size:13.5px;color:rgba(243,238,223,.7);font-weight:500}
.mini{font-size:5px;width:48px;height:48px;display:grid;place-items:center;flex:none}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ph-grid figure{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#0b1f18}
.ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
.ph-grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ph-miss{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px;font-family:var(--f-type);font-size:11px;color:rgba(243,238,223,.6);border:1px dashed rgba(243,238,223,.35);border-radius:8px}
.hob-more{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media (max-width:600px){.ph-grid{grid-template-columns:repeat(3,1fr)}}
.hob-more li{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid rgba(243,238,223,.2);border-radius:999px;font-weight:600;font-size:15px}
.hob-more .mini{width:34px;height:34px;font-size:3.6px}
.hob-more .nt{font-weight:500;color:rgba(243,238,223,.7);font-size:13.5px;margin-left:4px}

/* ---------- skills ---------- */
.skillwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.sgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sgroup{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px 18px;box-shadow:var(--lift);border-top:6px solid var(--gc,var(--canary))}
.sgroup h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;color:#3b4650}
.sgroup li{padding:6px 0;border-top:1px solid rgba(21,32,43,.12)}
.sgroup li:first-child{border-top:0}
.sgroup b{display:block;font-size:16px}
.sgroup span{display:block;font-size:13.5px;color:#4a5560;line-height:1.35}
@media (max-width:900px){.skillwrap{grid-template-columns:1fr}}
@media (max-width:520px){.sgroups{grid-template-columns:1fr}}

/* ---------- footer ---------- */
.foot-slim{padding:56px 0 40px}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid rgba(243,238,223,.2);padding-top:22px}
.foot-in h2{font-size:1.6rem;font-weight:900;font-variation-settings:"wdth" 70;text-transform:uppercase}
.foot-in .contact-row{margin:0}
.foot-copy{margin-top:16px;font-size:13.5px;color:rgba(243,238,223,.6);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
</style>

    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    frame.addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); const r = svg.getBoundingClientRect(), s = view.w / r.width;
      view = zoom(Math.exp(e.deltaY * 0.006), view.x + (e.clientX - r.left) * s, view.y + (e.clientY - r.top) * s); apply(); }, { passive: false });
    window.addEventListener('resize', () => { if (ready && svg.clientWidth) apply(); });
  }
  function onShow() {
    if (!svg.clientWidth) return; aspect = svg.clientHeight / svg.clientWidth;
    if (!ready) { ready = true; view = { x: 0, y: 105, w: 1000 }; apply(); setTimeout(() => fit(1500), reduce ? 0 : 450); } else apply();
  }
  return { render, onShow };
})();

/* ==================================================================== skills */
function renderSkills() {
  const groups = [], gcol = {}; (C.skills || []).forEach(s => { if (!(s.group in gcol)) { gcol[s.group] = s.color; groups.push(s.group); } });
  const KC = { yellow: 'var(--canary)', green: '#5FB088', pink: 'var(--pink)', white: '#c9c3b0', ink: '#3a424c' };
  const ed = C.education || {};
  $('#page-skills').innerHTML = `
  <div class="wrap page-head"><h1>Skills &amp; certifications</h1><p>What I work with, and where I have used it.</p></div>
  <div class="wrap skillwrap">
    <div class="sgroups">${groups.map(g => `<div class="sgroup" style="--gc:${KC[gcol[g]] || KC.white}"><h3>${esc(g)}</h3><ul>${C.skills.filter(s => s.group === g).map(s => `<li><b>${esc(s.key)}</b>${s.detail && s.detail !== 'Microsoft ' + s.key ? `<span>${esc(s.detail)}</span>` : ''}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="creds">
      ${(C.certifications || []).map(c => `<div class="plaque">${guilloche(400, 190, '#1e4a3a', '#DCE8DF')}<small>${esc(c.note)}</small><b>${esc(c.name)}</b><span class="seal">${esc(c.short)}</span></div>`).join('')}
    </div>
  </div>
  <section class="sec wrap" aria-labelledby="h-honors"><div class="sec-head"><h2 id="h-honors">Honors</h2></div>
    <div class="ribbons">${(C.honors || []).map(h => `<div class="rib"><div class="ros"><b>${esc(h.short)}</b></div><div class="tails"></div><p>${esc(h.name)}${h.note ? `<span>${esc(h.note)}</span>` : ''}</p></div>`).join('')}</div>
  </section>
  <section class="sec wrap" aria-labelledby="h-edu"><div class="sec-head"><h2 id="h-edu">Education</h2></div>
    <div class="edu"><div class="pennant" aria-hidden="true">${esc(ed.pennant || '')}</div>
      <div class="index"><h3>${esc(ed.school || '')}</h3><p>${esc(ed.degree || '')}</p><p>${esc(ed.graduating || '')}</p>
        <p><b>Relevant coursework</b></p><ul>${(ed.coursework || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>${ed.highSchool ? `<p><b>Before Rutgers</b></p><p>${esc(ed.highSchool)}</p>` : ''}</div></div>
  </section>`;
}

/* =================================================================== contact */
function renderContact() {
  $('#contact').innerHTML = `<div class="foot-in"><h2>Get in touch</h2>${contactRow()}</div>
  <div class="foot-copy"><span>© ${new Date().getFullYear()} ${esc(FULL)}</span><span>${esc(C.location)}</span></div>`;
}

/* =================================================================== reveal */
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: 0.12 });
function watch(root) { $$('.rv', root).forEach(el => { if (reduce) el.classList.add('in'); else if (!el.dataset.w) { el.dataset.w = 1; io.observe(el); } }); }

/* ==================================================================== router */
const PAGES = ['home', 'projects', 'map', 'skills'];
const TITLES = { home: FULL, projects: 'Projects', map: 'Map', skills: 'Skills' };
let current = null;
function pill() { const a = $('.nav-links a[aria-current="page"]'), p = $('.nav-pill'); if (!a) return; p.style.width = a.offsetWidth + 'px'; p.style.transform = `translateX(${a.offsetLeft}px)`; }
function go(name) {
  if (name === current) return;
  $$('.page').forEach(p => p.classList.toggle('is-active', p.id === 'page-' + name));
  $$('.nav-links a').forEach(a => { if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  current = name; window.scrollTo(0, 0); pill();
  document.title = name === 'home' ? FULL : `${TITLES[name]} | ${FULL}`;
  if (name === 'map') TravelMap.onShow();
  watch($('#page-' + name));
}
const route = () => { const h = location.hash.slice(1); if (PAGES.includes(h)) go(h); else if (current === null) go('home'); };

/* ====================================================================== boot */
renderHome(); renderProjects(); TravelMap.render(); renderSkills(); renderContact();
window.addEventListener('hashchange', route);
window.addEventListener('resize', pill);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(pill);
route();
})();
</script>
</body>
</html>
